name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-26
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install ffmpeg (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macos)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --lib

      - name: Integration tests (task protocol, CLI)
        run: cargo test --test cli_ux --test login_cli --test task_execution

      - name: Integration tests (synthetic video)
        if: runner.os != 'Windows'
        run: cargo test --features integration --test scene_synthetic

      - name: Smoke build
        run: cargo build --release
